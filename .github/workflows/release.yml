name: Build and publish DriveDesk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Download rclone
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force third_party | Out-Null
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile rclone.zip
          Expand-Archive rclone.zip -DestinationPath rclone-expanded
          Copy-Item (Get-ChildItem rclone-expanded -Recurse -Filter rclone.exe | Select-Object -First 1).FullName third_party\rclone.exe

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean DriveDesk.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          iscc "/DAppVersion=$version" installer\DriveDesk.iss

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/installer/DriveDesk-Setup-*.exe
